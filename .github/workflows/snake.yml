name: 🐍 Generate Contribution Snake

on:
  schedule:
    - cron: "0 */12 * * *"   # her 12 saatte bir güncellenir
  workflow_dispatch:          # Actions sekmesinden elle çalıştırılabilir
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#6a0f7a
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FF00EF&color_dots=#161b22,#3b0a45,#6a0f7a,#b100c9,#ff00ef
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
